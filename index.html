<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyDaeqD39PdaItBpA6QVoqQeal9oyc-8wyM",authDomain:"curso-qualidade.firebaseapp.com",projectId:"curso-qualidade",storageBucket:"curso-qualidade.firebasestorage.app",messagingSenderId:"200964867914",appId:"1:200964867914:web:a3dbc689e5d426375ae3b3"};
const WEEKS=[
 {w:1,items:[{m:1,d:1,t:"Linguagem comum",q:"O que é qualidade e gestão pela qualidade total?"},{m:2,d:2,t:"Impacto no negócio",q:"Quanto custa a má qualidade?"},{m:3,d:3,t:"Cliente",q:"Quem define a qualidade e como a ouvimos?"},{m:4,d:4,t:"Cultura e ética",q:"Que comportamentos e valores a sustentam?"}]},
 {w:2,items:[{m:5,d:1,t:"Liderança e autonomia",q:"O que muda no papel da direção e das equipas?"},{m:6,d:2,t:"Trabalho conjunto",q:"Como evitar que política e conflitos bloqueiem decisões?"},{m:7,d:3,t:"Decidir com dados",q:"Que ferramentas usar e como decidir?"},{m:8,d:4,t:"Normas e implementação",q:"Quando faz sentido a ISO 9000 e por onde começamos?"},{s:1,t:"Sessão de grupo",q:"No fim dos 8 desafios: comparar as respostas e preparar o rascunho do roadmap"}]}
];
const STEPS1=[
{type:"info",kind:"Conceito",title:"O que é qualidade",text:"Para Goetsch e Davis, qualidade é um **estado dinâmico** de **produtos, serviços, pessoas, processos e ambientes** que **satisfaz ou excede as expectativas dos clientes** e ajuda a criar **valor superior**.",pairs:[["Estado dinâmico","O que hoje é considerado qualidade pode deixar de o ser."],["Valor superior","Resulta da combinação entre qualidade, custo e serviço."]]},
{type:"info",kind:"Conceito",title:"Clientes externos e internos",text:"Na qualidade total, **cliente** é quem recebe o resultado de um trabalho, seja fora ou dentro da empresa.",pairs:[["Clientes externos","Quem compra ou usa o produto ou serviço."],["Clientes internos","Colegas ou equipas que precisam do resultado do teu trabalho para fazerem o seu."],["Exemplo","A equipa de montagem é cliente interna de quem prepara as peças: precisa delas a tempo e sem erros."]]},
{type:"info",kind:"Conceito",title:"O que é qualidade total",text:"É uma **abordagem de gestão**: uma forma global de gerir a organização, e não um método ou uma ferramenta isolada. Preconiza a **melhoria contínua** de tudo o que afeta a qualidade e incide sobre **quatro áreas**:",chips:["Pessoas","Processos","Produtos e serviços","Ambientes de trabalho"]},
{type:"mc",kind:"Pergunta",title:"Quem tem a palavra final sobre o que é qualidade aceitável?",opts:["O departamento de qualidade","O cliente","A direção","A norma ISO"],a:1,why:"Na qualidade total, o cliente é o principal juiz. Os clientes externos definem a qualidade do produto ou serviço entregue. Os clientes internos ajudam a definir a qualidade das pessoas, dos processos e dos ambientes."},
{type:"info",kind:"Modelo",title:"O banco de três pernas",text:"Goetsch e Davis resumem a abordagem como um banco. O assento é o foco no cliente, e as pernas são medição, pessoas e processos.",stool:true},
{type:"match",kind:"Associar",title:"Liga cada perna ao que significa",pairs:[["Medição","A qualidade pode e deve ser medida: os dados servem para definir referências, acompanhar o desempenho e orientar melhorias"],["Pessoas","A qualidade é criada por quem faz o trabalho, com autonomia para o fazer bem"],["Processos","Têm de melhorar continuamente, porque o que hoje é excelente pode ser apenas mediano amanhã"]],order:[2,0,1],why:"Sem uma destas pernas, o sistema fica incompleto."},
{type:"info",kind:"Conceito",title:"Qualidade ampla e qualidade restrita",text:"Qualidade ampla e qualidade restrita distinguem a **abrangência** da preocupação com a qualidade.",pairs:[["Qualidade ampla (Big Q)","Abrange produtos, serviços, pessoas, processos e ambientes."],["Qualidade restrita (Little Q)","Foca-se num só destes elementos ou num critério específico."]]},
{type:"mc",kind:"Caso",title:"Uma empresa melhora a inspeção do produto final, mas não altera processos, formação nem condições de trabalho.",text:"Que termo descreve esta abordagem?",opts:["Qualidade ampla (Big Q)","Qualidade restrita (Little Q)"],a:1,why:"A melhoria incide apenas num elemento: o produto final. Por isso, é qualidade restrita."},
{type:"info",kind:"Conceito",title:"Da deteção à prevenção",text:"A diferença central entre as duas visões está no momento em que se atua sobre o defeito.",pairs:[["Visão tradicional","Inspeciona depois de produzir e aceita um nível de defeitos, medido por cem unidades."],["Qualidade total","Previne antes de produzir, melhora continuamente e mede os defeitos por milhão."],["Percentagem ou por milhão?","São a mesma medição em escalas diferentes: 1% equivale a 10 000 por milhão. A percentagem é útil quando os defeitos são superiores a 1%. Por sua vez, a escala por milhão é mais adequada quando os defeitos são muito raros: 3,4 por milhão, a meta do Six Sigma, equivale a 0,00034%."]]},
{type:"sort",kind:"Classificar",title:"Visão tradicional ou qualidade total?",labels:["Tradicional","Qualidade total"],fb:["Esta afirmação pertence à visão tradicional.","Esta afirmação pertence à qualidade total."],cards:[["Os defeitos são uma parte esperada da produção",0],["Os defeitos previnem-se com sistemas de controlo eficazes",1],["A qualidade garante-se inspecionando no fim",0],["A qualidade determina-se no projeto do produto e do processo",1],["A qualidade é responsabilidade de um departamento",0],["A qualidade é responsabilidade de toda a organização",1]],why:"Goetsch e Davis contrastam as duas visões nestes pontos."},
{type:"mc",kind:"Discussão",title:"Numa reunião, alguém diz: «Se investirmos em qualidade, vamos perder produtividade.»",text:"Qual é a posição de uma abordagem baseada no conceito de qualidade total?",opts:["Produtividade e qualidade estão sempre em conflito","Os ganhos duradouros de produtividade resultam de melhorias de qualidade","A produtividade deixa de ser um objetivo"],a:1,why:"A visão tradicional vê um conflito: mais qualidade significaria menos produção. A qualidade total inverte o raciocínio: desperdício, retrabalho e atrasos consomem tempo e recursos. Ao eliminar as suas causas, sobra capacidade para produzir mais com os mesmos meios, e o ganho mantém-se."},
{type:"info",kind:"Conceito",title:"A regra 85/15",text:"Goetsch e Davis citam uma **regra prática**, com origem em Juran e Deming, sobre onde se podem corrigir os problemas de qualidade.",pairs:[["Pelo menos 85%","Só se corrigem mudando os sistemas, em grande parte definidos pela gestão."],["Menos de 15%","Estão sob controlo dos trabalhadores."],["O que implica","A maior capacidade de atuar e melhorar está na gestão. Os valores propostos são meramente indicativos e não uma medição aplicável a todas as empresas."]]},
{type:"mc",kind:"Caso",title:"Um defeito repete-se há meses. A primeira reação é procurar quem errou.",text:"O que sugere a qualidade total?",opts:["Sancionar o operador do último turno","Aumentar a inspeção final","Analisar o sistema e o papel da gestão no problema"],a:2,why:"Um defeito que se repete aponta para o sistema, não apenas para uma pessoa. Segundo a regra 85/15, é aí que está a maior capacidade de o corrigir."},
{type:"info",kind:"Conceito",title:"Liberdade através do controlo",text:"Um bom sistema funciona melhor quando os trabalhadores têm autonomia para propor soluções de melhoria da qualidade. Autonomia não significa perda de controlo: limites e métodos bem definidos permitem às pessoas resolver problemas dentro da sua área de decisão.",pairs:[["Dentro dos limites","A pessoa decide e aplica."],["Fora dos limites","A pessoa dá a sua opinião e decide quem tem essa responsabilidade."]]},
{type:"mc",kind:"Caso",title:"Um operador descobre uma forma melhor de preparar a máquina, sem prejudicar outras etapas.",text:"Segundo o princípio de liberdade através do controlo, o que deve acontecer?",opts:["Aplica a melhoria e mostra-a aos colegas","Não muda nada sem ordem superior","Muda também o fornecedor, se achar necessário"],a:0,why:"A autonomia existe dentro de limites definidos. Pode melhorar a sua parte do processo, mas uma decisão sobre fornecedores exige outro nível. Nesse caso, deve poder dar a sua opinião."},
{type:"info",kind:"Conceito",title:"Outros elementos da qualidade total",text:"Para além do que já viste, Goetsch e Davis destacam:",pairs:[["Abordagem científica","Usar dados para definir referências, acompanhar resultados e melhorar."],["Compromisso de longo prazo","Tratar a qualidade como nova forma de gerir, não como iniciativa pontual."],["Trabalho de equipa","Reduzir a competição interna entre departamentos e trabalhadores."],["Unidade de propósito","Colaborar para um objetivo comum, sem política interna."]]},

{type:"order",kind:"Ordenar",title:"Ordena os passos para medir o custo da má qualidade",items:["Listar as tarefas que só existem porque algo correu mal, como refazer trabalhos ou tratar reclamações","Decidir como estimar o custo de cada tarefa","Recolher dados e fazer as estimativas","Analisar os resultados e agir por ordem de prioridade"],show:[2,0,3,1],why:"Começar por listar estas tarefas permite escolher os projetos de melhoria com maior retorno."},

{type:"info",kind:"Conceito",title:"A satisfação tem de ser renovada",text:"Os **clientes fiéis** são os que voltam a comprar, e são os mais importantes para a empresa. A satisfação tem de ser **conquistada em cada compra**, por isso exige melhoria contínua.",pairs:[["Olhar para fora","Uma empresa focada no cliente orienta-se pelas necessidades do cliente, não apenas pelos seus resultados internos."],["Como começar","Pôr os trabalhadores em contacto com os clientes, presencialmente, por telefone ou através de dados, e dar-lhes autonomia para resolver."]]},

{type:"info",kind:"Conceito",title:"O que é cultura organizacional",text:"É a forma como os **valores e as tradições** da empresa se mostram **no dia a dia**: como as pessoas se comportam, o que esperam umas das outras e o que é considerado normal.",pairs:[["Cultura de qualidade","Um sistema de valores que cria um ambiente favorável a estabelecer e melhorar continuamente a qualidade."],["Como se reconhece","Pelos comportamentos, não pelos slogans. Se a empresa anuncia que valoriza o cliente mas o atende mal, é o comportamento que mostra a sua cultura."]]},
{type:"info",kind:"Conceito",title:"O que cria a cultura",text:"Goetsch e Davis destacam quatro fatores. Todos podem **ajudar ou prejudicar** a empresa.",pairs:[["Valores dos decisores","Os valores da direção refletem-se muitas vezes na cultura da empresa."],["Como a gestão trata as pessoas","Se trata com confiança, dignidade e respeito, as pessoas tendem a tratar-se da mesma forma."],["Expectativas","O que a gestão espera dos trabalhadores e o que estes esperam da gestão."],["Histórias","O que os trabalhadores contam uns aos outros mantém a cultura viva."]]},
{type:"info",kind:"Conceito",title:"Cultura tradicional e cultura de qualidade",text:"As diferenças notam-se sobretudo nestes pontos.",pairs:[["Prioridade","Tradicional: lucro de curto prazo. Qualidade: satisfação do cliente e sobrevivência a longo prazo."],["Papel da gestão","Tradicional: o chefe pensa e dá ordens. Qualidade: o gestor orienta a equipa, dá recursos e remove obstáculos."],["Problemas","Tradicional: procura culpados e depende de heróis. Qualidade: a equipa procura a causa raiz."],["Melhoria","Tradicional: só quando surge um problema. Qualidade: faz parte do trabalho, de forma contínua."],["Fornecedores","Tradicional: pressão sobre preço e prazo. Qualidade: parceria para melhorar os dois lados."]]},

{type:"mc",kind:"Caso",title:"Sempre que há uma urgência, a mesma pessoa resolve-a sozinha e é elogiada por isso. Os problemas continuam a repetir-se.",text:"Qual é a leitura de uma cultura de qualidade?",opts:["É o melhor sistema, porque os problemas ficam resolvidos","A empresa depende de um herói: é preciso procurar a causa raiz em equipa","O problema está na pessoa, que devia trabalhar mais depressa"],a:1,why:"Depender de heróis é irregular e não elimina a causa do problema. O objetivo é criar soluções, não heróis."},
{type:"info",kind:"Conceito",title:"Porque é difícil mudar a cultura",text:"Os autores dizem que implementar a qualidade total **sem mudar a cultura** é um convite ao fracasso. Apontam três dificuldades.",pairs:[["Ambiente hostil","Gestores habituados a dar ordens ou colegas habituados a competir entre si podem rejeitar a mudança."],["Demora tempo","Os resultados raramente surgem a curto prazo, e a situação até pode piorar antes de melhorar."],["Peso do passado","Quem já viu outras iniciativas de gestão desaparecer tende a pensar: «isto também passa»."]]},
{type:"info",kind:"Conceito",title:"Defensores e resistentes",text:"Juran descreve a mudança como um **choque entre duas culturas**. Os dois lados costumam errar.",pairs:[["Defensores da mudança","Concentram-se nos benefícios e esquecem como os outros veem a mudança."],["Resistentes à mudança","Concentram-se nas ameaças ao seu estatuto, crenças, hábitos e segurança, e não reconhecem os benefícios."],["Exemplo","Para um programa de formação, os primeiros veem pessoas mais qualificadas. Os segundos veem um gasto demasiado grande."]]},

{type:"match",kind:"Associar",title:"Liga cada preocupação ao que alguém pode dizer",pairs:[["Perda de controlo","«Até agora, as decisões sobre a minha área eram minhas. Com isto, deixam de ser.»"],["Incerteza","«Não sei se vou conseguir trabalhar com o novo método, nem o que me acontece se falhar.»"],["Mais trabalho","«Além do que já faço, vou ter de aprender isto tudo e ficar mais horas.»"]],order:[2,0,1],why:"Perceber a preocupação concreta permite dar uma resposta concreta."},
{type:"info",kind:"Conceito",title:"Como facilitar a mudança",text:"Cabe a quem defende a mudança facilitá-la. Estas são algumas estratégias que os autores atribuem a Juran.",pairs:[["Envolver e não surpreender","Trazer as pessoas afetadas para o planeamento desde o início."],["Começar devagar e em pequeno","Um teste-piloto ameaça menos, revela problemas e evita desperdiçar recursos."],["Criar um ambiente positivo","Reconhecer tentativas sérias de melhorar, mesmo que falhem. Os gestores também põem mãos à obra."],["Responder depressa","Esperar por respostas aumenta as preocupações."],["Dar algo em troca","Se a mudança exige esforço extra, compensar, por exemplo com tempo de folga."]]},
{type:"mc",kind:"Caso",title:"A direção decidiu mudar um processo em toda a fábrica e quer anunciar a mudança na segunda-feira.",text:"Que alternativa facilita mais a mudança?",opts:["Anunciar e aplicar em toda a fábrica, para não perder tempo","Envolver desde já as pessoas afetadas e testar primeiro numa área","Aplicar sem anunciar, para evitar discussão"],a:1,why:"Surpreender as pessoas torna-as resistentes convictas. Envolvê-las e testar em pequena escala cria adesão e revela problemas antes de os alargar."},
{type:"info",kind:"Conceito",title:"Da cultura à ética: o que está em causa",text:"A cultura define o que é normal na empresa, incluindo **o que se faz sob pressão**. Por isso, as decisões éticas afetam diretamente a qualidade, o desempenho e a relação com o cliente.",pairs:[["Qualidade","Expedir um produto que se sabe ter defeito, para cumprir um prazo ou melhorar as contas, é ao mesmo tempo uma decisão de qualidade e uma decisão ética."],["Desempenho da empresa","Os autores associam as práticas éticas a pessoas mais motivadas, boa reputação, maior capacidade de atrair e manter bons profissionais e mais vendas. Os custos tendem a ser de curto prazo e os benefícios de longo prazo."],["Relação com o cliente","O foco no cliente depende da confiança. Quando uma empresa perde a reputação, os clientes levam o negócio para outro lado."]]},
{type:"info",kind:"Conceito",title:"Porque a ética faz parte da qualidade",text:"**Ética** é fazer o que está certo dentro de um quadro moral. Para os autores, a qualidade total não funciona sem ética porque o comportamento ético **cria confiança**.",pairs:[["O que depende da confiança","Comunicação, trabalho de equipa, resolução de problemas, autonomia dos trabalhadores e foco no cliente."],["Legal não é o mesmo que ético","Uma decisão pode cumprir a lei e, mesmo assim, não ser ética."]]},
{type:"info",kind:"Conceito",title:"Cinco perguntas para testar uma decisão",text:"Goetsch propõe estes testes para ajudar a ver o que é ético quando a resposta parece pouco clara.",pairs:[["Manhã seguinte","Como me vou sentir com isto amanhã de manhã?"],["Primeira página","Gostaria de ver isto na primeira página do jornal local?"],["Espelho","Como me vou sentir ao olhar para o espelho?"],["Papéis invertidos","Como me sentiria se fosse eu a sofrer as consequências?"],["Bom senso","O que diz o bom senso?"]]},
{type:"info",kind:"Conceito",title:"Quando a empresa empurra para o erro",text:"Os autores notam que a própria empresa pode **contribuir para comportamentos pouco éticos**.",pairs:[["Pressão irrealista","Uma má planificação da gestão leva as pessoas a procurar atalhos."],["Encostar à parede","«Não me interessa como, mas cumpre o prazo» é uma autorização implícita para qualquer atalho."],["Falta de exemplo","As pessoas seguem as ações da gestão mais do que as suas palavras."],["Punir quem age bem","Quem faz o que está certo não pode sair prejudicado."]]},
{type:"mc",kind:"Caso",title:"Um responsável deteta um lote defeituoso já expedido, avisa o cliente e substitui-o. O relatório do mês piora.",text:"Como deve reagir a direção?",opts:["Penalizá-lo, porque os resultados do mês pioraram","Reconhecer a decisão, porque fez o que estava certo","Pedir-lhe que, numa próxima vez, espere pela reclamação"],a:1,why:"Penalizar esta decisão ensina as pessoas a esconder problemas. Os autores usam este exemplo para mostrar que não reconhecer o comportamento ético o desencoraja."},
{type:"mc",kind:"Discussão",title:"Uma prática comercial cumpre a lei, mas ninguém na direção gostaria de a ver publicada no jornal local.",text:"O que significa este sinal?",opts:["Não há problema, porque é legal","Convém reavaliar a prática: legal não significa ético","Basta garantir que não se torna pública"],a:1,why:"É o teste da primeira página. Cumprir a lei não basta para que uma decisão seja ética."},
{type:"pick",max:3,kind:"A tua visão · 1 de 4",title:"Que valores devem orientar a mudança na empresa?",lead:"Os valores que devem orientar a mudança são:",sep:"; ",cards:[["Honestidade e transparência","honestidade e transparência",null],["Respeito pelas pessoas","respeito pelas pessoas",null],["Foco no cliente","foco no cliente",null],["Melhoria contínua","melhoria contínua",null],["Trabalho de equipa","trabalho de equipa",null],["Responsabilidade e cumprimento","responsabilidade e cumprimento",null]]},
{type:"pick",kind:"A tua visão · 2 de 4",title:"Quando há uma falha, o que deve acontecer primeiro?",lead:"Quando há uma falha, devemos",cards:[["Identificar quem errou","identificar quem errou",0],["Procurar a causa raiz em equipa","procurar a causa raiz em equipa",1],["Resolver depressa e seguir em frente","resolver depressa e seguir em frente",0],["Perceber o que falhou no processo","perceber o que falhou no processo",1]]},
{type:"pick",kind:"A tua visão · 3 de 4",title:"O que pode bloquear mais a mudança na empresa?",lead:"O que pode bloquear mais a mudança é:",sep:"; ",cards:[["Medo e incerteza","medo e incerteza",null],["Falta de tempo","falta de tempo",null],["Iniciativas anteriores que não ficaram","iniciativas anteriores que não ficaram",null],["Falta de exemplo da direção","falta de exemplo da direção",null],["Conflitos entre áreas","conflitos entre áreas",null]]},

{type:"define",kind:"A tua visão",title:"Os teus valores e obstáculos",hint:"Não há respostas certas. Estas escolhas servem de ponto de partida para a sessão de grupo e ficam visíveis para quem gere o curso."}

{type:"info",kind:"Conceito",title:"O que é liderança",text:"Para Goetsch e Davis, liderança é a capacidade de **inspirar as pessoas** a comprometerem-se, de forma **total e voluntária**, com os objetivos da organização.",pairs:[["Liderança para a qualidade","Aplica esta capacidade para melhorar continuamente pessoas, processos e produtos."],["Porquê","Os autores associam essa melhoria a mais qualidade, valor, produtividade, serviço e quota de mercado."]]},
{type:"info",kind:"Conceito",title:"Gerir e liderar",text:"Os autores, citando John Kotter, explicam que são **coisas diferentes e complementares**. A empresa precisa das duas.",pairs:[["Gerir","Lidar com a complexidade: planear, orçamentar, organizar, distribuir pessoas, controlar e resolver problemas."],["Liderar","Lidar com a mudança: criar uma visão, alinhar as pessoas com ela, motivá-las e inspirá-las."]]},
{type:"sort",kind:"Classificar",title:"Gerir ou liderar?",labels:["Gerir","Liderar"],fb:["Esta atividade está do lado da gestão.","Esta atividade está do lado da liderança."],cards:[["Planear e orçamentar",0],["Criar uma visão para a mudança",1],["Organizar e distribuir as pessoas",0],["Alinhar as pessoas com a visão",1],["Controlar o cumprimento do plano",0],["Motivar as pessoas a querer cumprir o plano",1]]},
{type:"info",kind:"Conceito",title:"Quatro estilos de liderança",text:"O estilo é a forma como o líder se relaciona com quem lidera.",pairs:[["Autocrático","Decide sem consultar quem executa e espera obediência."],["Democrático","Ouve a equipa e toma a decisão final. Pode favorecer decisões populares em vez das certas."],["Participativo","Dá informação e deixa a equipa desenvolver soluções, conduzindo-a a um consenso. Exige mais tempo."],["Orientado para objetivos","Foca a equipa só nas metas. Pode deixar passar problemas e oportunidades fora desse foco."]]},
{type:"match",kind:"Associar",title:"Liga cada estilo ao que o líder diz",pairs:[["Autocrático","«Já decidi como vai ser. Amanhã começamos assim, e não há nada a discutir.»"],["Democrático","«Quero ouvir as vossas recomendações antes de tomar a decisão final.»"],["Participativo","«Aqui está a informação sobre o problema. Procurem uma solução e cheguem a um consenso.»"]],order:[1,2,0],why:"A diferença está em quem contribui para a decisão e em quem a toma."},
{type:"info",kind:"Conceito",title:"O estilo da qualidade total",text:"Os autores defendem uma **liderança participativa levada a um nível superior**: não basta pedir opiniões.",pairs:[["O que muda","As ideias vêm de pessoas com autonomia, e são registadas, acompanhadas e levadas a ação."],["Ideias imperfeitas","Em vez de as rejeitar, trabalha-se com quem as propôs para as melhorar."],["Reconhecimento","Recompensa-se quem contribui para uma melhoria."]]},
{type:"mc",kind:"Caso",title:"A direção pediu ideias aos trabalhadores. Passados meses, ninguém sabe o que lhes aconteceu.",text:"O que falta, segundo a qualidade total?",opts:["Nada, porque as pessoas foram ouvidas","Registar as ideias, dar resposta, agir e reconhecer os contributos","Pedir mais ideias"],a:1,why:"Recolher contributos não é novo. O que distingue esta abordagem é o que acontece depois de os recolher."},
{type:"info",kind:"Conceito",title:"Como a liderança cria confiança",text:"Os autores tratam a confiança como condição para liderar. Dão dois exemplos concretos do comportamento da gestão.",pairs:[["Assumir a culpa e partilhar o mérito","Responder pelo desempenho da equipa e distribuir o reconhecimento quando é merecido."],["Ajudar quando é preciso","Pôr mãos à obra quando um prazo está perto."]]},
{type:"info",kind:"Conceito",title:"O que é autonomia dos trabalhadores",text:"Os autores usam o termo inglês empowerment. Significa **pedir ativamente a opinião de quem está mais perto do trabalho** e dar-lhe **responsabilidade sobre o que faz**.",pairs:[["Não é abdicar","A gestão mantém a responsabilidade pela decisão, e passa a decidir com melhor informação."],["O que a gestão ganha","Tempo para as decisões maiores, porque não lhe chegam todos os pequenos problemas."],["Porque compensa","Não serve apenas para as pessoas se sentirem bem: melhora o desempenho, a qualidade e a competitividade."]]},
{type:"mc",kind:"Caso",title:"Antes de mudar um processo, a direção pede a opinião de quem o executa, analisa-a e decide.",text:"O que está a acontecer?",opts:["A direção perdeu o controlo da empresa","A direção envolve as pessoas, sem abdicar da responsabilidade","A direção está a evitar decidir"],a:1,why:"Fazer parte do processo de decisão não é o mesmo que decidir sozinho. A responsabilidade final continua na direção."},
{type:"info",kind:"Conceito",title:"O que bloqueia a autonomia",text:"Sem compromisso da gestão, a autonomia **não funciona**, mesmo que os trabalhadores a apoiem.",pairs:[["Medo de perder controlo","Alguns gestores receiam perder poder ou ver expostos os seus erros."],["«Quem manda sou eu»","Acreditar que as pessoas devem apenas fazer o que lhes mandam."],["Chefias excluídas","Quem fica de fora, como as chefias intermédias, tende a resistir."],["Ceticismo","Quem já viu outras iniciativas desaparecer espera que esta também passe."],["Estrutura","Demasiados níveis até à decisão, ou avaliações que penalizam quem arrisca."]]},
{type:"info",kind:"Conceito",title:"Antes de dar autonomia",text:"Os autores avisam que dar autonomia a quem **não está preparado** pode ser pior do que não a dar. Mas essa falta de preparação não é desculpa: é preciso preparar as pessoas.",pairs:[["Pensar criticamente","Estão habituadas a perguntar se há uma forma melhor de fazer?"],["Conhecer as regras","Sabem como se decide na empresa, qual é o seu papel e quais os limites?"],["Conhecer o objetivo","Sabem para onde vai a empresa e qual é o seu contributo?"]]},
{type:"mc",kind:"Caso",title:"Uma empresa disse aos seus técnicos para fazerem o necessário para satisfazer o cliente. Um deles alugou um avião para entregar uma peça urgente.",text:"Segundo os autores, o que falhou?",opts:["O técnico devia ter ignorado o cliente","A autonomia foi dada sem definir os limites","A autonomia não funciona nas empresas"],a:1,why:"É um exemplo real contado pelos autores. A direção assumiu que bastava o bom senso e teve depois de definir limites práticos."},
{type:"info",kind:"Conceito",title:"Formas de recolher contributos",text:"Os autores apresentam vários métodos, adequados a situações diferentes.",pairs:[["Sessão de ideias (brainstorming)","Todos propõem sem julgamentos, e as ideias só se avaliam no fim."],["Técnica de grupo nominal","Cada pessoa escreve as suas ideias em silêncio, e o grupo vota. Reduz a pressão dos colegas."],["Círculos de qualidade","Grupos de voluntários que se reúnem com regularidade para propor melhorias."],["Falar no local de trabalho","Andar pela fábrica e fazer perguntas abertas."],["Caixa de sugestões","Os autores consideram-na a forma menos eficaz."]]},
{type:"info",kind:"Conceito",title:"Liderar a mudança em seis passos",text:"É um modelo adaptado de Kotter. Começa pela **imagem da mudança**: um texto breve que explica o quê, onde, quando, quem, porquê e como. Assim, todos os líderes passam a mesma mensagem e cada grupo percebe como é afetado.",pairs:[["1 e 2","Escrever a imagem da mudança e comunicá-la a todos os envolvidos."],["3 e 4","Analisar os obstáculos e removê-los ou reduzi-los."],["5 e 6","Implementar, acompanhar e ajustar."]]},
{type:"order",kind:"Ordenar",title:"Ordena os passos para liderar a mudança",items:["Escrever a imagem da mudança","Comunicá-la a todos os envolvidos","Analisar os obstáculos","Remover ou reduzir os obstáculos","Implementar a mudança","Acompanhar e ajustar"],show:[2,5,0,4,1,3],why:"Reduzir o medo do desconhecido e os obstáculos antes de implementar aumenta a probabilidade de sucesso."},
{type:"pick",kind:"A tua visão · 1 de 3",title:"Como deve a direção decidir uma mudança que afeta a produção?",lead:"Numa mudança que afeta a produção, a direção deve",cards:[["Decidir e comunicar depois","decidir e comunicar depois",0],["Ouvir quem executa antes de decidir","ouvir quem executa antes de decidir",1],["Definir só a meta e controlar o resultado","definir só a meta e controlar o resultado",0],["Procurar a solução com as equipas","procurar a solução com as equipas",1]]},
{type:"pick",max:3,kind:"A tua visão · 2 de 3",title:"Que decisões devem os trabalhadores poder tomar por si?",lead:"Os trabalhadores devem poder:",sep:"; ",cards:[["Ajustar o seu método, sem afetar outras etapas","ajustar o seu método, sem afetar outras etapas",null],["Parar o trabalho ao detetar um defeito","parar o trabalho ao detetar um defeito",null],["Recusar trabalho com defeito da etapa anterior","recusar trabalho com defeito da etapa anterior",null],["Propor mudanças ao processo","propor mudanças ao processo",null],["Falar diretamente com o cliente sobre um problema","falar diretamente com o cliente sobre um problema",null]]},
{type:"pick",kind:"A tua visão · 3 de 3",title:"Como deve a empresa recolher as ideias das pessoas?",lead:"Para recolher ideias, a empresa deve usar:",sep:"; ",cards:[["Conversas no local de trabalho","conversas no local de trabalho",null],["Sessões de ideias","sessões de ideias",null],["Votação por escrito, com pouca pressão","votação por escrito, com pouca pressão",null],["Círculos de qualidade","círculos de qualidade",null],["Caixa de sugestões","caixa de sugestões",null]]},

const STEPS6=[
{type:"info",kind:"Conceito",title:"Um critério comum para decidir",text:"A qualidade total exige **unidade de propósito**: todas as pessoas conhecem a visão da empresa e trabalham para ela. Todas as decisões seguem o mesmo critério: **que opção serve melhor essa visão?**",pairs:[["O que isto exige","Colocar os interesses da empresa à frente dos interesses de cada pessoa, departamento ou equipa."],["O que a bloqueia","A política interna. Goetsch e Davis resumem: a qualidade é sobre «nós», e a política interna é sobre «mim»."]]},
{type:"info",kind:"Conceito",title:"O que é política interna",text:"São ações para **ganhar vantagem ou influenciar decisões** com um fim diferente do melhor para a empresa. A decisão deixa de se basear no **mérito**.",pairs:[["Pior cenário","A pessoa coloca o seu interesse à frente do da empresa."],["Melhor, mas ainda mau","A pessoa coloca o interesse do seu departamento à frente do da empresa."],["Porque surge","Os autores apontam insegurança, interesse próprio, ambição, desejo de poder e necessidade de aceitação. Não se elimina, mas pode controlar-se."]]},
{type:"info",kind:"Conceito",title:"Cinco fontes de poder",text:"**Poder** é a capacidade de influenciar. Não é bom nem mau: depende de servir os objetivos da empresa ou outros interesses.",pairs:[["Pessoal","Vem da personalidade: capacidade de persuadir, confiança e determinação."],["De posição","Vem do cargo: contratar, distribuir recursos, avaliar e decidir."],["De competência","Vem de saber fazer algo importante, que poucos sabem."],["De recompensa","Vem de poder dar ou retirar algo valorizado, como dinheiro, reconhecimento ou promoção."],["De coerção","Vem de poder castigar. Assenta no medo e em ameaças."]]},
{type:"match",kind:"Associar",title:"Liga cada fonte de poder à situação",pairs:[["De posição","A diretora de produção decide como distribuir o orçamento da sua área"],["De competência","O único técnico que sabe reparar uma máquina crítica tem mais influência do que o cargo indica"],["De coerção","Um chefe dá a entender que quem discordar pode perder o seu horário"]],order:[1,2,0],why:"Os autores tratam o poder como neutro: o que conta é para que serve e como é usado."},
{type:"info",kind:"Conceito",title:"O que a política interna custa",text:"Os autores comparam-na a uma equipa de tiro cujos membros **disparam uns contra os outros** em vez de apontarem ao alvo.",pairs:[["Pior ambiente","Conflitos, passar responsabilidades e rumores baixam a motivação."],["Piores decisões","As decisões deixam de ser tomadas a pensar no melhor para a empresa."],["Energia desperdiçada","O tempo gasto em lutas internas não é usado para competir no mercado."]]},
{type:"mc",kind:"Caso",title:"Dois responsáveis disputam o mesmo orçamento. Cada um apresenta apenas as necessidades da sua área.",text:"Como deve a direção decidir?",opts:["Dividir ao meio, para evitar conflito","Dar a quem tiver mais antiguidade","Escolher o que serve melhor os objetivos da empresa"],a:2,why:"A unidade de propósito dá um critério comum. Dividir ao meio evita o conflito, mas não garante a melhor decisão."},
{type:"info",kind:"Conceito",title:"Comportamentos territoriais",text:"**Territorialidade** é proteger a sua área, informação ou influência. É uma defesa instintiva, e os autores descrevem várias formas de o fazer.",pairs:[["Manipular informação","Reter, distorcer ou esconder informação."],["Barreira invisível","Atrasar, «perder» papéis ou esquecer encomendas, para que uma decisão não avance."],["Concordar sem cumprir","Dizer que sim, sem intenção de fazer, à espera de reverter a decisão."],["Desacreditar","Atacar quem faz a proposta, em vez de discutir a proposta."],["Falar até cansar","Discutir detalhes sem fim até o outro desistir ou o tempo acabar."]]},
{type:"match",kind:"Associar",title:"Liga cada comportamento ao que acontece",pairs:[["Concordar sem cumprir","Na reunião, todos aceitam o novo procedimento. Um mês depois, uma das áreas ainda não fez nada"],["Desacreditar","Em vez de responder à proposta, alguém comenta: «Ele nem conhece bem a fábrica»"],["Manipular informação","Uma área só apresenta os dados que favorecem a sua posição"]],order:[2,0,1],why:"Para ultrapassar estes comportamentos, os autores dizem que é preciso primeiro reconhecer que existem."},
{type:"info",kind:"Conceito",title:"Como controlar a política interna",text:"Os autores defendem um esforço **em toda a empresa**, com várias medidas.",pairs:[["Plano e princípios","Explicar o plano estratégico a todos e incluir a colaboração nos princípios da empresa."],["Exemplo da gestão","Decidir de acordo com o plano e recusar rumores e boatos."],["Recompensas e avaliação","Recompensar e avaliar também a colaboração, com efeito no salário e na promoção."],["Foco no cliente","Quando as decisões partem das preferências dos clientes, é mais difícil serem políticas."]]},
{type:"mc",kind:"Caso",title:"A direção pede mais trabalho de equipa, mas os prémios dependem só do desempenho individual.",text:"Qual é o problema?",opts:["Não há nenhum, porque são temas separados","As recompensas contrariam o que a direção pede","Os trabalhadores não querem trabalhar em equipa"],a:1,why:"Os autores apontam este desencontro como um dos erros mais frequentes: as pessoas seguem aquilo que é recompensado."},
{type:"info",kind:"Conceito",title:"Sinais de negatividade",text:"**Negatividade** é qualquer comportamento que prejudica o desempenho da empresa, a qualquer nível. Os autores indicam alguns sinais.",pairs:[["Sinais","Ouvir com frequência «não consigo», dizer «eles» em vez de «nós» ao falar da empresa, conversas sobretudo críticas e procura de culpados."],["Como combater","Comunicar com frequência, ser claro no que se espera, ouvir sem penalizar, criar confiança e envolver as pessoas."]]},
{type:"info",kind:"Conceito",title:"Conflito: causas e utilidade",text:"O conflito é **normal**, mesmo em equipas comprometidas com o mesmo objetivo. E **nem todo é mau**: se a equipa concorda depressa de mais, pode ser preciso estimular a discussão.",pairs:[["Recursos limitados","Quem fica com o quê?"],["Objetivos incompatíveis","Exemplo: um design pensado para o cliente, mas difícil de fabricar a baixo custo."],["Papéis pouco claros","Não se sabe quem tem a responsabilidade e a autoridade."],["Diferenças","Valores, perspetivas e falhas de comunicação."]]},
{type:"info",kind:"Conceito",title:"Cinco reações ao conflito",text:"Cada reação pode ser adequada a uma situação diferente.",pairs:[["Competir","Um ganha e o outro perde. Serve quando é preciso agir depressa ou tomar uma decisão impopular."],["Acomodar","Colocar primeiro as necessidades do outro. Serve quando a estabilidade é mais importante."],["Chegar a um compromisso","Cada lado procura uma solução que o ajude até onde for possível."],["Colaborar","Trabalhar em conjunto numa solução aceitável para os dois. Serve para aprender e resolver tensões."],["Evitar","Afastar-se do conflito. Serve quando é preciso deixar as pessoas acalmar."]]},
{type:"mc",kind:"Caso",title:"As áreas de design e de produção discordam há semanas sobre um produto. Os dois lados têm informação de que o outro precisa.",text:"Que reação é mais adequada?",opts:["Colaborar numa solução aceitável para os dois","Evitar o tema até passar","Deixar ganhar a área com mais peso"],a:0,why:"Colaborar permite juntar a informação dos dois lados. Evitar só faz sentido por pouco tempo, para as pessoas acalmarem."},

const FIG={
pareto(){const d=[["Montagem",45],["Acabamento",30],["Corte",10],["Embalagem",8],["Outros",7]],h=1.35,b=170;let c=0,pts=[];const bars=d.map((r,i)=>{const x=38+i*70;c+=r[1];pts.push(`${x+29},${b-c*h}`);return `<rect x="${x}" y="${b-r[1]*h}" width="58" height="${r[1]*h}" rx="3" fill="${i<2?"var(--accent)":"var(--line)"}"/>`+(i===0?`<text x="${x+29}" y="${b-r[1]*h+18}" text-anchor="middle" font-weight="700" font-size="13" style="fill:var(--on-accent)">45%</text>`:svgT(x+29,b-r[1]*h-5,r[1]+"%","middle","700"))+svgT(x+29,b+17,r[0],"middle","400",11.5)}).join("");return `<figure class="fig"><svg viewBox="0 0 400 195" role="img" aria-label="Diagrama de Pareto: montagem 45%, acabamento 30%, corte 10%, embalagem 8%, outros 7%"><path d="M30 ${b}H392" stroke="var(--muted)"/>${bars}<polyline points="${pts.join(" ")}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/></svg><figcaption>Exemplo com os defeitos de cada etapa e valores inventados. A linha mostra o total acumulado.</figcaption></figure>`},
fish(){const c=[["Pessoas",95,40],["Máquinas",215,40],["Materiais",95,170],["Métodos",215,170]];return `<figure class="fig"><svg viewBox="0 0 400 190" role="img" aria-label="Diagrama de causa-efeito com quatro grupos de causas a convergir para o problema"><path d="M20 105H300" stroke="var(--ink)" stroke-width="2.5"/><rect x="300" y="82" width="92" height="46" rx="6" fill="var(--accent)"/><text x="346" y="110" text-anchor="middle" font-weight="700" font-size="13" style="fill:var(--on-accent)">Problema</text>${c.map(r=>`<path d="M${r[1]} ${r[2]<105?48:162}L${r[1]+55} 105" stroke="var(--muted)" stroke-width="2"/>`+svgT(r[1],r[2]<105?38:180,r[0],"middle","700")).join("")}</svg><figcaption>As causas agrupam-se por categoria. Os grupos podem mudar conforme o problema.</figcaption></figure>`},
control(){const v=[50,56,46,52,48,58,44,54,49,84,51,47,55],sx=i=>30+i*29,sy=y=>170-y*1.5;const pts=v.map((y,i)=>`${sx(i)},${sy(y)}`).join(" ");return `<figure class="fig"><svg viewBox="0 0 400 180" role="img" aria-label="Gráfico de controlo com um ponto acima do limite superior"><path d="M20 ${sy(75)}H392" stroke="var(--bad)" stroke-dasharray="5 4"/><path d="M20 ${sy(25)}H392" stroke="var(--bad)" stroke-dasharray="5 4"/><path d="M20 ${sy(50)}H392" stroke="var(--muted)"/>${svgT(392,sy(75)-5,"Limite superior","end","400",12)}${svgT(392,sy(25)+15,"Limite inferior","end","400",12)}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>${v.map((y,i)=>`<circle cx="${sx(i)}" cy="${sy(y)}" r="${y>75?6:3.5}" fill="${y>75?"var(--bad)":"var(--accent)"}"/>`).join("")}</svg><figcaption>Exemplo ilustrativo. O ponto a vermelho sai dos limites e indica que algo mudou.</figcaption></figure>`}
};

  rows=team.map(t=>`<div class="row"><header><span>${esc(nm(t))}</span><span>${doneCount(t)} / 8 desafios</span></header><small>${esc(t.email||"")} · ${t.xp||0} XP · última atividade: ${t.updatedAt?new Date(t.updatedAt).toLocaleDateString("pt-PT"):"sem registo"}</small></div>`).join("");
  cmp=Object.keys(MODS).map(k=>{const ppl=team.filter(t=>t.mods?.[k]?.ans);if(!ppl.length)return "";
   const qs=MODS[k].steps.filter(x=>x.type==="pick").map(x=>`<div class="cq"><b>${esc(x.title)}</b>${x.cards.map(c=>{const who=ppl.filter(t=>t.mods[k].ans.some(q=>q.t===x.title&&q.a.includes(c[0])));return `<div class="co ${who.length?"":"zero"}"><span class="cn">${who.length}</span><span>${esc(c[0])}${who.length?`<small>${who.map(t=>esc(nm(t))).join(", ")}</small>`:""}</span></div>`}).join("")}</div>`).join("");
   const bal=ppl.filter(t=>(t.mods[k].tr||0)+(t.mods[k].tq||0)>0).map(t=>`<li>${esc(nm(t))}: ${t.mods[k].tr||0} tradicional · ${t.mods[k].tq||0} qualidade total</li>`).join("");
   return `<details class="cm" ${k==="1"?"open":""}><summary>${esc(MODS[k].title)} <small>${ppl.length} ${ppl.length===1?"resposta":"respostas"}</small></summary>${qs}${bal?`<div class="cq"><b>Equilíbrio das escolhas</b><ul>${bal}</ul></div>`:""}</details>`}).join("");
  if(cmp)cmp=`<h2 style="margin-top:22px">Comparar respostas</h2><p class="note" style="margin-top:6px">O número indica quantas pessoas escolheram cada opção.</p>${cmp}`}
 else if(team)rows=`<p class="note">Ainda ninguém concluiu um desafio. O progresso de cada pessoa aparece aqui depois do primeiro.</p>`;
 
 if(view!=="team")return;shell(`<h1>Progresso da equipa</h1><p class="note">Só tu vês esta vista.</p>${rows}${cmp}`)}
function stool(){return `<svg class="stool" viewBox="0 0 400 190" role="img" aria-label="Banco com assento Foco no cliente e três pernas: Medição, Pessoas e Processos"><rect x="60" y="14" width="280" height="42" rx="8" fill="var(--accent)"/><text x="200" y="41" text-anchor="middle" font-weight="700" style="fill:var(--on-accent)">Foco no cliente</text><g stroke="var(--muted)" stroke-width="10" stroke-linecap="round"><path d="M100 60 72 150"/><path d="M200 60V150"/><path d="M300 60 328 150"/></g><text x="66" y="178" text-anchor="middle">Medição</text><text x="200" y="178" text-anchor="middle">Pessoas</text><text x="334" y="178" text-anchor="middle">Processos</text></svg>`}
boot();
</script>
